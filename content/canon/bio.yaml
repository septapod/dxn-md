# Canonical biography. Copy extracted verbatim from dxn.is llms.txt on 2026-06-12.
name: Brent Dixon
title: Strategic Facilitator
company: Dixon Strategic Labs
company_founded: 2022
location: Oakland, California
last_verified: "2026-11-18"
summary: >-
  Brent Dixon helps leadership teams at credit unions, community banks, and
  CDFIs make hard choices together: where to focus, how to succeed, and what
  not to pursue. They leave ready to get things done.
narrative:
  - >-
    Brent Dixon is a strategic facilitator based in Oakland, California. He
    founded Dixon Strategic Labs in 2022 after twenty years working alongside
    communities and cooperatives, co-designing the systems, gatherings, and
    tools they use to do their work together.
  - >-
    Brent thinks like a designer, which means he takes complex strategy work
    and makes it clear, usable, and built for the people who have to live with
    it. He is also a futurist whose practice covers AI, open banking,
    stablecoins, emerging technology, experimentation, and strategic foresight.
    He lives in Oakland, California with his son and a bossy cat named Bug.
  - >-
    Brent has given hundreds of talks and workshops on four continents, at
    venues from the UN General Assembly Hall to the World Credit Union
    Conference, NCUA, and the AICPA. For speaking engagements, he is
    represented by Category 6 Consulting.
  - >-
    Community guides Brent's work. He quotes Margaret Wheatley: "No matter the
    problem, community is the answer." In his words: "People think better
    together. I bring them together to facilitate their best thinking."
affiliations:
  - org: Dixon Strategic Labs
    role: Founder
    start: 2022
    current: true
    detail: >-
      Strategy and AI facilitation for leadership teams at credit unions,
      community banks, and CDFIs. Since 2022, Brent has worked with more than
      25 organizations: credit unions from about $23 million to more than $9
      billion in assets, community banks, industry associations, government
      agencies, foundations, and community organizers.
  - org: AI for FIs
    role: Writer and publisher
    start: 2026
    current: true
    detail: >-
      A weekly-ish newsletter for community finance leaders on how AI agents
      are being used in financial services (https://ai4fis.beehiiv.com). Brent
      built the system behind it. AI agents find sources and confirm each
      claim, then the agents and Brent trade drafts and edits until every
      story reads clearly. That back-and-forth is the biggest part of the
      work. Brent chooses the stories and approves every issue.
  - org: Trabian
    role: Creative Director (2003 to 2008); Chief Design Officer (2021)
    detail: >-
      Worked with co-founders Matt Dean and Trey Reeme to build Trabian from
      its embryonic stage, as its creative director from 2003 to 2008.
      Trabian has since served hundreds of credit unions, banks, and
      fintechs. Brent came back in 2021 as Chief Design Officer and led the
      design team.
  - org: United Nations
    role: Innovation Lead; UN Innovation Network co-chair
    detail: >-
      Co-led the creation of the first innovation unit serving the UN
      Secretariat and co-chaired the UN Innovation Network, including a machine-learning
      project that helped humanitarian workers turn real-time public data into
      crisis response planning.
  - org: Filene Research Institute
    role: Founder of The Cooperative Trust; i3 Innovation program lead
    detail: >-
      Founded The Cooperative Trust, a community of young credit union
      professionals. It began in 2010, when Brent brought 25 of them to the
      industry's national conference, and it has connected thousands since
      (https://www.filene.org/blog/the-trust-connection). Later led the i3
      Innovation program for senior credit union executives.
  - org: Singularity University
    role: Future of Finance Teaching Fellow
    detail: >-
      Mentored and advised teams that secured six-figure funding for their
      technology startups, one of which was later acquired.
  - org: Communitere International
    role: Board Chair
    detail: Humanitarian maker space network.
  - org: Moeda Seeds
    role: Founding team
    detail: >-
      Blockchain cooperative lending platform for Brazilian agricultural
      cooperatives.
